spring.application.name=mi-proyecto

spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS:1433;databaseName=db_diabetes;encrypt=false;trustServerCertificate=true
spring.datasource.username=springuser
spring.datasource.password=Spring12345!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
